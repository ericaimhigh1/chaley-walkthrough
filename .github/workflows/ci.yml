name: Library checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    env:
      CHALEY_BROWSER: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:package
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checks-${{ matrix.browser }}
          path: |
            playwright-report/
            test-results/
            *.tgz
          retention-days: 14
